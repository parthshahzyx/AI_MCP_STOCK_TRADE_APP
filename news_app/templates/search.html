<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>News Search - Vector Lookup</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card-bg: #ffffff;
      --border: #e4e7ee;
      --text: #1f2430;
      --muted: #6b7280;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --success: #10b981;
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      max-width: 900px;
      margin: 48px auto;
      padding: 0 20px;
      color: var(--text);
      background: var(--bg);
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
      line-height: 1.5;
    }

    .nav {
      margin-bottom: 20px;
    }

    .nav a {
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
    }

    .nav a:hover {
      text-decoration: underline;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-top: 24px;
      box-shadow: 0 1px 3px rgba(16, 24, 40, 0.04);
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
    }
    label:first-child { margin-top: 0; }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 10px 12px;
      margin-top: 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.15s ease;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    input[type="text"]:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    button {
      margin-top: 18px;
      padding: 10px 18px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.15s ease;
    }
    button:hover { background: var(--accent-hover); }
    button:active { transform: translateY(1px); }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }

    #status.loading {
      display: block;
      background: #e0e7ff;
      color: var(--accent);
    }

    #status.error {
      display: block;
      background: #fee;
      color: #b91c1c;
    }

    .results-container {
      margin-top: 24px;
    }

    .result-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      transition: box-shadow 0.15s ease;
    }

    .result-item:hover {
      box-shadow: 0 4px 12px rgba(16, 24, 40, 0.08);
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .result-meta {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .ticker-badge {
      display: inline-block;
      padding: 4px 10px;
      background: var(--accent);
      color: white;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .similarity-score {
      font-size: 12px;
      color: var(--success);
      font-weight: 600;
    }

    .chunk-info {
      font-size: 11px;
      color: var(--muted);
    }

    .result-text {
      line-height: 1.7;
      color: var(--text);
      font-size: 14px;
      margin-top: 12px;
    }

    .no-results {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }

    .result-count {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="nav">
    <a href="/">&larr; Back to Watchlist</a>
  </div>

  <h1>Semantic News Search</h1>
  <p class="hint">Search through news articles using natural language. The system finds the most relevant content chunks based on semantic similarity.</p>

  <div class="card">
    <form id="search-form">
      <label for="query">Search query</label>
      <textarea id="query" name="query" placeholder="e.g., What are the latest developments in Apple's AI initiatives?" required></textarea>
      
      <label for="limit">Number of results</label>
      <input type="text" id="limit" name="limit" value="10" placeholder="10">
      
      <button type="submit" id="search-btn">Search</button>
    </form>

    <div id="status"></div>
  </div>

  <div id="results-container" style="display: none;">
    <div class="card">
      <div class="result-count" id="result-count"></div>
      <div id="results"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById("search-form");
    const queryInput = document.getElementById("query");
    const limitInput = document.getElementById("limit");
    const searchBtn = document.getElementById("search-btn");
    const statusEl = document.getElementById("status");
    const resultsContainer = document.getElementById("results-container");
    const resultsEl = document.getElementById("results");
    const resultCountEl = document.getElementById("result-count");

    function setStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = type || "";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const query = queryInput.value.trim();
      if (!query) {
        setStatus("Please enter a search query", "error");
        return;
      }

      const limit = parseInt(limitInput.value) || 10;
      
      setStatus("Searching...", "loading");
      searchBtn.disabled = true;
      resultsContainer.style.display = "none";

      try {
        const resp = await fetch("/api/vector-search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, limit }),
        });

        const data = await resp.json();
        
        if (!resp.ok) {
          setStatus("Error: " + (data.error || resp.statusText), "error");
          return;
        }

        displayResults(data);
        setStatus("");
      } catch (err) {
        setStatus("Request failed: " + err, "error");
      } finally {
        searchBtn.disabled = false;
      }
    });

    function displayResults(data) {
      if (!data.results || data.results.length === 0) {
        resultsEl.innerHTML = '<div class="no-results">No results found. Try a different query.</div>';
        resultsContainer.style.display = "block";
        return;
      }

      resultCountEl.textContent = `Found ${data.count} result${data.count !== 1 ? 's' : ''} for "${data.query}"`;
      
      resultsEl.innerHTML = data.results.map(result => {
        const similarity = (result.similarity * 100).toFixed(1);
        const date = result.embedded_at ? new Date(result.embedded_at).toLocaleDateString() : "N/A";
        
        return `
          <div class="result-item">
            <div class="result-header">
              <div class="result-meta">
                <span class="ticker-badge">${result.ticker}</span>
                <span class="similarity-score">${similarity}% match</span>
              </div>
              <div class="chunk-info">
                Chunk ${result.chunk_index + 1} • ${date}
              </div>
            </div>
            <div class="result-text">${escapeHtml(result.chunk_text)}</div>
          </div>
        `;
      }).join("");

      resultsContainer.style.display = "block";
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
